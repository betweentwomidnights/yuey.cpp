# ABOUTME: Builds the portable Windows packages for a published release and
# ABOUTME: attaches them with SHA256SUMS, for supervisors that install yuey.
#
# The package contract every native service follows is
# docs/native-runtime-packages.md in gary-localhost-installer; docs/packaging.md
# here is yuey's side of it, including the release checklist.
name: release

on:
  release:
    types: [published]
  # With a tag: rebuild and re-attach for a release that already exists, e.g.
  # after a runner failure; assets are replaced, not duplicated. Without one:
  # a dry run of the chosen branch, packaged under the version CMakeLists.txt
  # declares and kept as a workflow artifact, so the release path is proven
  # before anything is published.
  workflow_dispatch:
    inputs:
      tag:
        description: existing release tag to build and attach to (e.g. v0.2.0); empty for a dry run
        required: false
        type: string

permissions:
  contents: write
  # Build provenance: `gh attestation verify <zip> -R betweentwomidnights/yuey.cpp`
  # proves a package was built by this workflow from the tagged commit.
  id-token: write
  attestations: write

jobs:
  windows:
    name: windows-x64 (cpu + cuda + vulkan)
    # Pinned rather than windows-latest: the CUDA toolkit's MSBuild integration
    # targets Visual Studio 2022, and ci/package-windows.ps1 asks for that
    # generator by name. A runner image moving to a newer Visual Studio should
    # be a change made here on purpose, not one that turns up as a red release.
    runs-on: windows-2022
    # Every CUDA architecture ggml's portable default covers is compiled, which
    # is most of this job's time.
    timeout-minutes: 240
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      VULKAN_VERSION: 1.4.350.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
          submodules: recursive

      # A release is packaged under its tag, which the package script checks
      # against CMakeLists.txt; a dry run under what CMakeLists.txt declares.
      - name: Choose the version
        shell: pwsh
        run: |
          if ($env:TAG) {
            $version = $env:TAG
          } else {
            $match = Select-String -Path CMakeLists.txt -Pattern 'project\(yue2_cpp VERSION (\d+\.\d+\.\d+)'
            if (-not $match) { throw "no project(VERSION) in CMakeLists.txt" }
            $version = "v" + $match.Matches[0].Groups[1].Value
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "packaging $version$(if (-not $env:TAG) { ' (dry run)' })"

      # The full toolkit rather than network sub-packages, so the build sees
      # the same toolkit layout as a developer machine.
      - name: Cache CUDA toolkit
        id: cache-cuda
        uses: actions/cache@v4
        with:
          path: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA
          key: cuda-12.8.1-windows-2022

      - name: Install CUDA toolkit
        if: steps.cache-cuda.outputs.cache-hit != 'true'
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: '12.8.1'

      # A cache hit skips the installer, which is what normally sets these.
      - name: Point at the CUDA toolkit
        shell: pwsh
        run: |
          $cuda = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v12.8"
          "CUDA_PATH=$cuda" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$cuda\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The official LunarG SDK, the same one a developer machine has. A
      # trimmed install leaves out SPIRV-Headers' CMake config, which ggml's
      # Vulkan backend asks for, and the first release dry run failed on it.
      - name: Cache Vulkan SDK
        id: cache-vulkan
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ env.VULKAN_VERSION }}
          key: vulkan-sdk-${{ env.VULKAN_VERSION }}-windows-2022

      - name: Install Vulkan SDK
        if: steps.cache-vulkan.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "vulkansdk.exe"
          curl.exe -fsSL -o $installer "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          if ($LASTEXITCODE -ne 0) { throw "could not download the Vulkan SDK $env:VULKAN_VERSION" }
          # A GUI-subsystem installer: without -Wait the step would move on
          # while it's still unpacking.
          $run = Start-Process -FilePath $installer -Wait -PassThru `
            -ArgumentList "--accept-licenses", "--default-answer", "--confirm-command", "install"
          if ($run.ExitCode -ne 0) { throw "the Vulkan SDK installer exited with $($run.ExitCode)" }

      - name: Point at the Vulkan SDK
        shell: pwsh
        run: |
          $sdk = "C:\VulkanSDK\$env:VULKAN_VERSION"
          $spirv = Join-Path $sdk "Lib\cmake\SPIRV-Headers\SPIRV-HeadersConfig.cmake"
          if (-not (Test-Path $spirv)) { throw "the Vulkan SDK at $sdk has no SPIRV-Headers CMake config" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build, test, and package
        shell: pwsh
        run: ./ci/package-windows.ps1 -Version $env:VERSION

      - name: Keep the packages
        uses: actions/upload-artifact@v4
        with:
          name: yuey-${{ env.VERSION }}-windows-x64
          path: dist/
          retention-days: 14

      - name: Attest provenance
        if: env.TAG != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.zip'

      - name: Attach to release
        if: env.TAG != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:TAG (Get-ChildItem dist -File).FullName --clobber
